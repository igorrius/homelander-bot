<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ca678" />
    <title>Немає зʼєднання · No connection</title>
    <style>
      :root { color-scheme: light dark; --fg: #212529; --dim: #6b7280; --bg: #f8f9fa; --card: #ffffff; --line: #dee2e6; }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #e9ecef; --dim: #a1a1aa; --bg: #1a1b1e; --card: #25262b; --line: #373a40; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg); color: var(--fg);
      }
      main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; text-align: center; }
      .dot { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 50%; background: #0ca67822; display: grid; place-items: center; color: #0ca678; font-size: 24px; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { margin: 0 0 4px; color: var(--dim); line-height: 1.45; }
      hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
      a { display: inline-block; margin-top: 20px; padding: 10px 22px; border-radius: 8px; background: #0ca678; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true">⟳</div>
      <h1 lang="uk">Немає зʼєднання</h1>
      <p lang="uk">Перевірте інтернет і спробуйте ще раз.</p>
      <hr />
      <h1 lang="en">No connection</h1>
      <p lang="en">Check your internet connection and try again.</p>
      <a href="">Спробувати ще раз · Try again</a>
    </main>
  </body>
</html>
